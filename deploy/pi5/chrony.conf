# --- Sources: local GPS stratum-1 preferred; WAN pool as deep fallback ---
server 192.168.1.17 iburst xleave prefer minpoll 2 maxpoll 6
server 192.168.100.1 iburst xleave
pool us.pool.ntp.org iburst maxpoll 10

driftfile /var/lib/chrony/drift
bindcmdaddress /run/chrony/chronyd.sock
makestep 1.0 3
rtcsync

# Logging to characterize OCXO frequency stability / holdover
logdir /var/log/chrony
log tracking measurements statistics refclocks

allow all
cmdallow 127.0.0.1
lock_all
sched_priority 99

# TEST 2026-06-20: RP1 GEM HW timestamping on 7.1 RT kernel (revert: delete next line)
hwtimestamp eth0
# offset 0.0000018 = the Pi 5's entry-stamp delay behind the true edge (Pi-4 pairing, 2026-09-08); the QPPS feeder
# applies the same 1.8 us as DELIVERY_NS (systemd drop-in). Keep the two in step.
refclock PPS /dev/pps-gps refid PPS poll 2 dpoll -2 precision 1e-9 filter 16 offset 0.0000018
refclock SHM 2 refid QPPS poll 2 dpoll -2 precision 1e-9 filter 16 prefer
