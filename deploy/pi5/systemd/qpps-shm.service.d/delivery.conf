[Service]
# DELIVERY_NS: .18 entry-stamp delay behind the true edge, from the Pi-4 pairing 2026-09-08 (run 4: 2.44 us pulse
# arrival; warmer loop 2.22 us; minus ~0.5 us posted-write flight => 1.8 +/- 0.25 us). Keep in step with the
# "offset 0.0000018" on the raw PPS refclock line in chrony.conf.
ExecStart=
ExecStart=/usr/local/bin/qpps-shm.py 1800
