# RP1 entry-stamp kernel (7.3.0-rc1-v8-rt-rp1ts+): report the pinctrl entry timestamp, taken before the
# PCIe status read. Measured 2026-09-07: idle 6.9->5.0 ns, DRAM hog 62->8.6 ns, fork storm 68->32 ns.
# Harmless on kernels without the parameter (logged as unknown parameter, ignored).
options pps_gpio use_early=1
